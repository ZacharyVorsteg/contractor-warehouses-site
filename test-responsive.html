<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Test</title>
    <style>
        body { margin: 0; font-family: Arial; background: #f0f0f0; }
        .test-width { padding: 20px; margin: 20px; background: white; border-radius: 8px; }
        .label { font-weight: bold; margin-bottom: 10px; color: #333; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="test-width">
        <div class="label">Test at these widths (DevTools):</div>
        <p>769px → Header items should NOT start wrapping (4 nav items + CTA button)</p>
        <p>768px → Mobile nav expected to collapse</p>
        <p>1024px → Tablet layout, hero content still 2-column</p>
        <p>1280px → Desktop, full breathing room</p>
    </div>
</body>
</html>
